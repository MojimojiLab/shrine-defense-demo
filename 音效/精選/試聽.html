<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>神社保衛戰音效試聽</title>
<style>
  :root { --bg: #f7f5f0; --fg: #1f2328; --muted: #6a6f76; --line: #ddd8cc; --accent: #b23a2a; }
  @media (prefers-color-scheme: dark) { :root { --bg: #15171c; --fg: #e8e6e1; --muted: #9aa0a8; --line: #2c3038; --accent: #e07a5f; } }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.6 system-ui, "Noto Sans TC", sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p { color: var(--muted); margin: 0 0 20px; }
  .row { display: grid; grid-template-columns: 1fr auto; gap: 4px 16px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .name { font-weight: 600; }
  .file { color: var(--muted); font-size: 13px; font-family: ui-monospace, monospace; }
  audio { height: 32px; max-width: 260px; }
  @media (max-width: 560px) { .row { grid-template-columns: 1fr; } audio { max-width: 100%; width: 100%; } }
</style>
</head>
<body>
<main>
  <h1>《神社保衛戰》音效試聽</h1>
  <p>全部 CC0。來源與原始檔見上一層的 README.md。</p>
  <div id="list"></div>
</main>
<script>
const items = [
  ["符咒發射", "shot_talisman.ogg"], ["擊中", "hit.ogg"], ["敵人消散", "enemy_vanish.mp3"],
  ["吸收經驗球", "orb_pickup.ogg"], ["升級", "level_up.mp3"], ["強化游標", "ui_select.ogg"],
  ["選定強化", "ui_confirm.ogg"], ["神社被打", "shrine_hit.ogg"], ["新的一波", "wave_start.ogg"],
  ["淨化結界", "purify_burst.ogg"], ["鬼王降臨", "boss_land.ogg"], ["鬼王吼聲", "boss_roar.wav"],
  ["重槌預警", "boss_warning.ogg"], ["重槌落地", "boss_slam.ogg"], ["三道鬼火", "boss_fireball.ogg"],
  ["喚靈咆哮", "boss_summon.wav"], ["鬼王倒下", "boss_defeat.ogg"], ["守護成功", "win.ogg"], ["神社失守", "lose.ogg"]
];
const list = document.getElementById("list");
for (const [name, file] of items) {
  const row = document.createElement("div"); row.className = "row";
  row.innerHTML = `<div><div class="name">${name}</div><div class="file">${file}</div></div><audio controls preload="none" src="${file}"></audio>`;
  list.appendChild(row);
}
</script>
</body>
</html>
